name: crv

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: crv
      POSTGRES_PASSWORD: crv
      POSTGRES_DB: crv
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U crv -d crv"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    volumes:
      - redisdata:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: crv-api:${CRV_VERSION:-dev}
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    ports:
      - "8080:8080"

  worker:
    image: crv-worker:${CRV_VERSION:-dev}
    build:
      context: ../..
      dockerfile: docker/worker.Dockerfile
    restart: unless-stopped
    env_file: ../../.env
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
    volumes:
      - crvdata:/var/lib/crv/objects

  web:
    image: crv-web:${CRV_VERSION:-dev}
    build:
      context: ../..
      dockerfile: docker/web.Dockerfile
    restart: unless-stopped
    environment:
      CRV_API_BASE_URL: http://localhost:8080
    ports:
      - "3737:80"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    restart: unless-stopped
    env_file: ../../.env
    ports:
      - "4000:4000"
    profiles: ["proxy"]  # only starts with: docker compose --profile proxy up

volumes:
  pgdata:
  redisdata:
  crvdata:
