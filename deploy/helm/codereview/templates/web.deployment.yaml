apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "crv.fullname" . }}-web
  labels: {{- include "crv.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "crv.name" . }}
      app.kubernetes.io/component: web
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "crv.name" . }}
        app.kubernetes.io/component: web
    spec:
      containers:
        - name: web
          image: "{{ .Values.image.repository }}/crv-web:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports: [{ containerPort: 80 }]
          env:
            - name: CRV_API_BASE_URL
              value: {{ printf "http://%s-api:%d" (include "crv.fullname" .) (int .Values.api.service.port) | quote }}
          resources: {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "crv.fullname" . }}-web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: {{ .Values.web.service.port }}
      targetPort: 80
  selector:
    app.kubernetes.io/name: {{ include "crv.name" . }}
    app.kubernetes.io/component: web
