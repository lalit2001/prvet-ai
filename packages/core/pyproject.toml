[project]
name = "crv-core"
version = "0.1.0"
description = "Shared models, settings, and domain types for Sentry Review."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy[asyncio]>=2.0",
    "greenlet>=3.0",
    "structlog>=24.1",
    "asyncpg>=0.29",
    "arq>=0.26",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crv_core"]
