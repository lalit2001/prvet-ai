[project]
name = "crv-adapters"
version = "0.1.0"
description = "Portability layer. Cloud SDK imports live ONLY here."
requires-python = ">=3.12"
dependencies = [
    "crv-core",
    "httpx>=0.27",
]

[project.optional-dependencies]
aws = ["boto3>=1.34"]
azure = ["azure-storage-blob>=12.20", "azure-servicebus>=7.12", "azure-identity>=1.17", "azure-keyvault-secrets>=4.8"]
gcp = ["google-cloud-storage>=2.17", "google-cloud-pubsub>=2.21"]
k8s = ["kubernetes>=30.1"]
redis = ["redis>=5.0", "arq>=0.26"]
postgres = ["asyncpg>=0.29"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crv_adapters"]

[tool.uv.sources]
crv-core = { workspace = true }
