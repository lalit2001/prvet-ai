[project]
name = "crv-api"
version = "0.1.0"
description = "Sentry Review API — FastAPI. Component 1 (PRD §6)."
requires-python = ">=3.12"
dependencies = [
    "crv-core",
    "crv-adapters",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "testcontainers>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crv_api"]

[tool.uv.sources]
crv-core = { workspace = true }
crv-adapters = { workspace = true }
