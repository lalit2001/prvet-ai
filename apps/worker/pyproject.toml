[project]
name = "crv-worker"
version = "0.1.0"
description = "Sentry Review worker + orchestrator. Components 3-4 (PRD §6)."
requires-python = ">=3.12"
dependencies = [
    "crv-core",
    "crv-adapters",
    "arq>=0.26",
    "structlog>=24.1",
    "tree-sitter>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crv_worker"]

[tool.uv.sources]
crv-core = { workspace = true }
crv-adapters = { workspace = true }
