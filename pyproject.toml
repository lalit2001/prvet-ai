[project]
name = "crv-monorepo"
version = "0.1.0"
description = "Sentry Review — self-hosted AI code review. Meta package."
requires-python = ">=3.12"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "import-linter>=2.0",
    "testcontainers[postgres,redis]>=4.7",
]

[tool.uv.workspace]
members = ["apps/api", "apps/worker", "packages/core", "packages/adapters"]

[tool.uv.sources]
crv-core = { workspace = true }
crv-adapters = { workspace = true }
crv-api = { workspace = true }
crv-worker = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH", "TID"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["crv_core", "crv_adapters"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["apps/api/tests", "apps/worker/tests", "packages/core/tests", "packages/adapters/tests"]

[tool.importlinter]
root_packages = ["crv_api", "crv_worker", "crv_core", "crv_adapters"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Cloud SDKs live only in packages/adapters"
type = "forbidden"
source_modules = ["crv_api", "crv_worker", "crv_core"]
forbidden_modules = ["boto3", "botocore", "azure", "google", "kubernetes"]
